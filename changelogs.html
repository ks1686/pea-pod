<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pea Pod Network — Changelogs tracking the development history of this site." />
    <meta name="theme-color" content="#4ade80" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Changelogs — Pea Pod Network" />
    <script>document.documentElement.classList.add("js");</script>
    <meta property="og:description" content="Track the development &amp; progress of Pea Pod Network." />
    <meta property="og:url" content="https://pea-pod.me/changelogs" />
    <meta property="og:image" content="https://pea-pod.me/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pea-pod.me/icons/icon-512.png" />

    <link rel="icon" type="image/png" href="/favicon.png" width="32" height="32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" width="180" height="180" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/styles.css" />

    <title>Changelogs — Pea Pod Network</title>
  </head>
  <body data-theme="pea-pod">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="bg-decoration" aria-hidden="true"></div>

    <button class="burger-btn" id="burger-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="side-menu">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>

    <div class="menu-overlay" id="menu-overlay" aria-hidden="true"></div>

    <nav class="side-menu" id="side-menu" aria-label="Site navigation" aria-hidden="true">
      <div class="side-menu-header">
        <span class="side-menu-title">~/navigation</span>
        <button class="side-menu-close" id="side-menu-close" aria-label="Close navigation menu">✕</button>
      </div>
      <ul class="side-menu-list">
        <li>
          <a class="side-menu-link" href="/#karim-work">
            <span class="side-menu-icon" aria-hidden="true">🌟</span>
            <span>Karim's Work</span>
          </a>
        </li>
        <li>
          <a class="side-menu-link" href="/changelogs" aria-current="page">
            <span class="side-menu-icon" aria-hidden="true">📋</span>
            <span>Changelogs</span>
          </a>
        </li>
        <li>
          <a class="side-menu-link" href="/genv">
            <span class="side-menu-icon" aria-hidden="true">📦</span>
            <span>GENV</span>
          </a>
        </li>
        <li>
          <a class="side-menu-link" href="/public-terminal">
            <span class="side-menu-icon" aria-hidden="true">💹</span>
            <span>Public Terminal</span>
          </a>
        </li>
      </ul>
    </nav>

    <header>
      <div class="container">
        <div class="logo-wrap">
          <span class="logo-icon" aria-hidden="true">🫛</span>
          <h1 class="site-title">pea<span class="accent">-</span>pod</h1>
        </div>
        <p class="site-tagline">git log --oneline · site history</p>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="container">
        <a class="nav-back" href="/" aria-label="Back to home">← Back to Home</a>

        <section class="section" aria-labelledby="changelog-heading">
          <h2 class="section-label" id="changelog-heading">Changelogs</h2>

          <div id="changelog-container" aria-live="polite" aria-label="Commit history">
            <div class="changelog-loading" id="changelog-loading">
              <div class="spinner" aria-hidden="true"></div>
              <p>Loading commits…</p>
            </div>
          </div>

          <div class="load-more-wrap" id="load-more-wrap" hidden>
            <button class="btn-load-more" id="btn-load-more" type="button">
              Load more commits ↓
            </button>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>
          🫛 Pea Pod Network &mdash; deployed on
          <a href="https://workers.cloudflare.com" target="_blank" rel="noopener noreferrer">Cloudflare Workers</a>
        </p>
      </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/changelogs.js"></script>
  </body>
</html>
